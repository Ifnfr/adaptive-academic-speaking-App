<svg width="100%" viewBox="0 0 680 220" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Fonetik logo for website</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Fonetik app logo designed to match the Speaking Gym website aesthetic</desc>

  <defs>
    
  </defs>

  <!-- === LOGO MARK: mic inside rounded square === -->
  <!-- Outer square -->
  <rect x="240" y="70" width="44" height="44" rx="10" fill="#f5f3ee" stroke="rgba(0,0,0,0.13)" stroke-width="0.5" style="fill:rgb(245, 243, 238);stroke:rgba(0, 0, 0, 0.13);color:rgb(255, 255, 255);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Mic body -->
  <rect x="258" y="80" width="10" height="16" rx="5" fill="#00796b" style="fill:rgb(0, 121, 107);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Mic arc base -->
  <path d="M252 94 Q252 103 263 103 Q274 103 274 94" fill="none" stroke="#00796b" stroke-width="1.4" stroke-linecap="round" style="fill:none;stroke:rgb(0, 121, 107);color:rgb(255, 255, 255);stroke-width:1.4px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Mic stand -->
  <line x1="263" y1="103" x2="263" y2="109" stroke="#00796b" stroke-width="1.4" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(0, 121, 107);color:rgb(255, 255, 255);stroke-width:1.4px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Mic base bar -->
  <line x1="258" y1="109" x2="268" y2="109" stroke="#00796b" stroke-width="1.4" stroke-linecap="round" style="fill:rgb(0, 0, 0);stroke:rgb(0, 121, 107);color:rgb(255, 255, 255);stroke-width:1.4px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- === WORDMARK + TAGLINE === -->
  <text x="294" y="100" style="fill:rgb(13, 13, 13);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Sans&quot;, sans-serif;font-size:26px;font-weight:500;text-anchor:start;dominant-baseline:auto">fonetik</text>
  <text x="295" y="115" style="fill:rgb(154, 154, 154);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;IBM Plex Mono&quot;, monospace;font-size:9px;font-weight:400;text-anchor:start;dominant-baseline:auto">SPEAK BETTER</text>

  <!-- Thin teal accent under tagline -->
  <line x1="295" y1="120" x2="402" y2="120" stroke="#00796b" stroke-width="0.5" opacity="0.45" style="fill:rgb(0, 0, 0);stroke:rgb(0, 121, 107);color:rgb(255, 255, 255);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.45;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

</svg>